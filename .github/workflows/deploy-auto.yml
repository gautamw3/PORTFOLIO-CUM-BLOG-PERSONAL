name: Django Auto CI/CD via AWS SSM

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Test and Deploy (Auto)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: portfolio_cum_blog.settings
      AWS_REGION: ${{ secrets.AWS_REGION }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          source venv/bin/activate
          pytest

      - name: Deploy to EC2 via AWS SSM
        id: deploy
        if: ${{ env.AWS_REGION != '' && env.INSTANCE_ID != '' }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region $AWS_REGION \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD Deploy Django App" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters 'commands=["/bin/bash /home/ubuntu/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command sent. ID: $COMMAND_ID"

          # Optional: Wait and fetch the result (add retries if needed)
          sleep 10
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --region "$AWS_REGION"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
