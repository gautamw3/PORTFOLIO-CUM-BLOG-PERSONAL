name: Django Auto CI/CD via AWS SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Test and Deploy (Auto)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: portfolio_cum_blog.settings
      AWS_REGION: ${{ secrets.AWS_REGION }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest

      - name: Deploy to EC2 via AWS Systems Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |

          APP_DIR="/home/ubuntu/apps/PORTFOLIO-CUM-BLOG-PERSONAL"
          VENV_DIR="/home/ubuntu/apps/.venv"

          START_TIME=$(date +%s)

          echo "========================================"
          echo "Starting Django Production Deployment"
          echo "========================================"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD Deploy Django Application" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters "commands=[
              \"set -e\",
              \"export HOME=/home/ubuntu\",

              \"echo ===== STEP 1 : Configure Git =====\",
              \"sudo git config --system --add safe.directory $APP_DIR\",

              \"echo ===== STEP 2 : Update Repository =====\",
              \"cd $APP_DIR\",
              \"git fetch --quiet origin\",
              \"git checkout -q main\",
              \"git reset --hard origin/main > /dev/null\",

              \"echo ===== STEP 3 : Install Dependencies =====\",
              \"$VENV_DIR/bin/pip install --quiet --upgrade pip\",
              \"$VENV_DIR/bin/pip install --quiet --disable-pip-version-check --no-cache-dir -r requirements.txt\",

              \"echo ===== STEP 4 : Apply Database Migrations =====\",
              \"$VENV_DIR/bin/python manage.py migrate --noinput\",

              \"echo ===== STEP 5 : Collect Static Files =====\",
              \"$VENV_DIR/bin/python manage.py collectstatic --noinput\",

              \"echo ===== STEP 6 : Restart Gunicorn =====\",
              \"sudo systemctl daemon-reload\",
              \"sudo systemctl restart gunicorn\",
              \"sudo systemctl is-active gunicorn\",

              \"echo ===== DEPLOYMENT COMPLETE =====\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID : $COMMAND_ID"
          echo ""

          while true
          do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Deployment Status : $STATUS"

            case "$STATUS" in

              Pending|InProgress|Delayed)
                sleep 5
                ;;

              Success)

                END_TIME=$(date +%s)
                DURATION=$((END_TIME - START_TIME))

                OUTPUT=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text)

                echo ""
                echo "========================================"
                echo "Deployment Successful"
                echo "========================================"
                echo "Instance : $INSTANCE_ID"
                echo "Duration : ${DURATION}s"
                echo "========================================"
                echo ""

                echo "$OUTPUT"

                break
                ;;

              Failed|Cancelled|TimedOut|ExecutionTimedOut)

                echo ""
                echo "========================================"
                echo "Deployment Failed"
                echo "========================================"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"

                exit 1
                ;;

              *)

                echo ""
                echo "Unexpected deployment status : $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"

                exit 1
                ;;

            esac

          done