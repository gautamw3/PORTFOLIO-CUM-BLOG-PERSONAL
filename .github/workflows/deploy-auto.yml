name: Django Auto CI/CD via AWS SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Test and Deploy (Auto)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: portfolio_cum_blog.settings
      AWS_REGION: ${{ secrets.AWS_REGION }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest

      - name: Deploy to EC2 via AWS Systems Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD Deploy Django Application" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters 'commands=[
              "set -e",
              "export HOME=/home/ubuntu",
              "sudo git config --global --add safe.directory /home/ubuntu/apps/PORTFOLIO-CUM-BLOG-PERSONAL",
              "cd /home/ubuntu/apps/PORTFOLIO-CUM-BLOG-PERSONAL",
              "git fetch origin",
              "git reset --hard origin/main",
              "/home/ubuntu/apps/.venv/bin/pip install -U pip",
              "/home/ubuntu/apps/.venv/bin/pip install -q --no-cache-dir -r requirements.txt",
              "/home/ubuntu/apps/.venv/bin/python manage.py migrate --noinput",
              "/home/ubuntu/apps/.venv/bin/python manage.py collectstatic --noinput",
              "sudo systemctl daemon-reload",
              "sudo systemctl restart gunicorn",
              "sudo systemctl status gunicorn --no-pager"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."

          while true
          do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Current Status: $STATUS"

            case "$STATUS" in

              Pending|InProgress|Delayed)
                sleep 5
                ;;

              Success)
                echo ""
                echo "Deployment completed successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"

                break
                ;;

              Failed|Cancelled|TimedOut|ExecutionTimedOut)

                echo ""
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"

                exit 1
                ;;

              *)

                echo "Unexpected deployment status: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"

                exit 1
                ;;

            esac
          done